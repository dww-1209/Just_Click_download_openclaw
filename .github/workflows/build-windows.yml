name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx psutil "pyinstaller>=6.11.0,<6.12.0" "pyside6>=6.8.0,<6.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.10.0'

      - name: Clone and build openclaw-cn
        shell: pwsh
        run: |
          git clone https://gitee.com/OpenClaw-CN/openclaw-cn.git "$env:USERPROFILE\openclaw-cn"
          Set-Location "$env:USERPROFILE\openclaw-cn"
          pnpm install
          pnpm build

      # 使用 Git Bash (MSYS2) 的 tar 来打包，避免 Python tarfile 在 Windows 上
      # 将 pnpm junction 误当作普通目录递归进入导致的路径爆炸问题。
      # MSYS2 tar 会把 junction 当作 symlink 处理（不跟随），且不受 MAX_PATH 限制。
      - name: Package openclaw-cn prebuilt
        shell: bash
        run: |
          mkdir -p resources/windows
          tar -czf "resources/windows/openclaw-prebuilt-windows.tar.gz" \
              -C "$USERPROFILE/openclaw-cn" \
              --exclude='.git' \
              .
          ls -lh "resources/windows/openclaw-prebuilt-windows.tar.gz"

      - name: Build executables
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Installer-Windows-${{ github.run_id }}
          path: dist/*.exe
          retention-days: 90

      - name: Upload full dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Dist-Full-${{ github.run_id }}
          path: dist/**/**
          retention-days: 90

      - name: Upload openclaw-cn prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-cn-prebuilt-windows
          path: resources/windows/openclaw-prebuilt-windows.tar.gz
          retention-days: 90
