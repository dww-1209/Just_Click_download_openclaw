name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx psutil "pyinstaller>=6.11.0,<6.12.0" "pyside6>=6.8.0,<6.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.10.0'

      - name: Clone and build openclaw-cn
        shell: pwsh
        run: |
          git clone https://gitee.com/OpenClaw-CN/openclaw-cn.git "$env:USERPROFILE\openclaw-cn"
          Set-Location "$env:USERPROFILE\openclaw-cn"
          pnpm install
          pnpm build

      # 使用 Git Bash (MSYS2) 的 tar 来打包，避免 Python tarfile 在 Windows 上
      # 将 pnpm junction 误当作普通目录递归进入导致的路径爆炸问题。
      # MSYS2 tar 会把 junction 当作 symlink 处理（不跟随），且不受 MAX_PATH 限制。
      - name: Package openclaw-cn prebuilt
        shell: bash
        run: |
          mkdir -p resources/windows
          tar -czf "resources/windows/openclaw-prebuilt-windows.tar.gz" \
              -C "$USERPROFILE/openclaw-cn" \
              --exclude='.git' \
              .
          ls -lh "resources/windows/openclaw-prebuilt-windows.tar.gz"

      - name: Build executables
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Upload installer artifact
        # Windows 上 build.py 只产 .exe(无 .app/.command 等附属物),
        # dist/ 下没有子目录,所以一个工件就够了。
        # 之前还有一个 OpenClaw-Dist-Full-* (path: dist/**/**),
        # 内容与本工件完全相同(纯冗余,浪费存储 + 用户困惑),已删除。
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Installer-Windows-${{ github.run_id }}
          path: dist/*.exe
          retention-days: 90

      # 验证：用 Python tarfile 解压产物，模拟离线安装器的解压过程，
      # 确认 Windows 上不会遇到 symlink 创建权限问题。
      - name: Test extraction (simulate offline installer)
        shell: pwsh
        run: |
          $testDir = "$env:TEMP\openclaw-extract-test"
          Remove-Item -Recurse -Force $testDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $env:TEST_DIR = $testDir

          python -c "
          import tarfile, os
          from pathlib import Path
          archive = Path('resources/windows/openclaw-prebuilt-windows.tar.gz')
          dest = Path(os.environ['TEST_DIR'])
          print(f'Archive size: {archive.stat().st_size / 1024 / 1024:.1f} MB')
          with tarfile.open(archive, 'r:gz') as tar:
              symlinks = [m for m in tar.getmembers() if m.issym() or m.islnk()]
              print(f'Symlink count: {len(symlinks)}')
              for s in symlinks[:5]:
                  print(f'  {s.name} -> {s.linkname}')
              tar.extractall(dest)
          print('Extraction OK')
          "

          $extracted = "$testDir\openclaw-cn"
          if (Test-Path $extracted) {
              $itemCount = (Get-ChildItem -Recurse $extracted | Measure-Object).Count
              Write-Host "Extracted items: $itemCount"
              Get-ChildItem $extracted | Select-Object -First 10 Name
          }

      - name: Upload openclaw-cn prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-cn-prebuilt-windows
          path: resources/windows/openclaw-prebuilt-windows.tar.gz
          retention-days: 90
