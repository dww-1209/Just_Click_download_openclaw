name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx psutil "pyinstaller>=6.11.0,<6.12.0" "pyside6>=6.8.0,<6.9.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.10.0'

      - name: Clone and build openclaw-cn
        shell: pwsh
        run: |
          git clone https://gitee.com/OpenClaw-CN/openclaw-cn.git "$env:USERPROFILE\openclaw-cn"
          Set-Location "$env:USERPROFILE\openclaw-cn"
          pnpm install
          pnpm build

      - name: Package openclaw-cn prebuilt
        shell: pwsh
        run: |
          python -c "
          import tarfile
          from pathlib import Path
          source = Path.home() / 'openclaw-cn'
          output = Path('resources/windows/openclaw-prebuilt-windows.tar.gz')
          output.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(output, 'w:gz') as tar:
              for item in source.iterdir():
                  if item.name == '.git':
                      continue
                  tar.add(item, arcname=f'openclaw-cn/{item.name}')
          size_mb = output.stat().st_size / 1024 / 1024
          print(f'Packaged: {output} ({size_mb:.1f} MB)')
          "

      - name: Build executables
        env:
          PYTHONIOENCODING: utf-8
        run: python build.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Installer-Windows-${{ github.run_id }}
          path: dist/*.exe
          retention-days: 90

      - name: Upload full dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-Dist-Full-${{ github.run_id }}
          path: dist/**/**
          retention-days: 90

      - name: Upload openclaw-cn prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-cn-prebuilt-windows
          path: resources/windows/openclaw-prebuilt-windows.tar.gz
          retention-days: 90
